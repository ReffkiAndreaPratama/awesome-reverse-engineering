<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Awesome Reverse Engineering: tools, safety flags and agent-era tooling for binaries, apps, firmware and smart contracts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#e0e7ff" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#312e81" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)" opacity="0.7"/>

  <!-- left: title -->
  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="104" font-size="18" font-weight="700" letter-spacing="4" fill="#6366f1">AWESOME LIST</text>
    <text x="70" y="176" font-size="64" font-weight="800" fill="#111827" letter-spacing="-1.5">Reverse</text>
    <text x="70" y="246" font-size="64" font-weight="800" fill="url(#accent)" letter-spacing="-1.5">Engineering</text>
    <text x="72" y="294" font-size="20" fill="#4b5563">Binaries, apps, firmware and smart contracts.</text>
    <text x="72" y="322" font-size="20" fill="#4b5563">Live data, a safety flag on every tool, agent-era MCP servers.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600">
    <rect x="72" y="346" width="118" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="131" y="367" text-anchor="middle" fill="#4338ca">▶ runs code</text>
    <rect x="200" y="346" width="104" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="252" y="367" text-anchor="middle" fill="#4338ca">☁ uploads</text>
    <rect x="314" y="346" width="150" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="389" y="367" text-anchor="middle" fill="#4338ca">◆ impersonated</text>
    <rect x="474" y="346" width="104" height="32" rx="16" fill="#ffffff" stroke="#fde68a"/>
    <text x="526" y="367" text-anchor="middle" fill="#b45309">⚠ stale</text>
  </g>

  <!-- right: disassembly panel -->
  <g filter="url(#shadow)">
    <rect x="700" y="56" width="510" height="308" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  </g>
  <rect x="700" y="56" width="510" height="40" rx="16" fill="#f9fafb"/>
  <rect x="700" y="80" width="510" height="16" fill="#f9fafb"/>
  <line x1="700" y1="96" x2="1210" y2="96" stroke="#e5e7eb"/>
  <circle cx="724" cy="76" r="6" fill="#fca5a5"/>
  <circle cx="744" cy="76" r="6" fill="#fde68a"/>
  <circle cx="764" cy="76" r="6" fill="#86efac"/>
  <text x="955" y="81" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#9ca3af">check_serial · 0x401a30</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <g fill="#9ca3af">
      <text x="722" y="128">401a30</text><text x="722" y="156">401a31</text><text x="722" y="184">401a34</text>
      <text x="722" y="212">401a39</text><text x="722" y="240">401a3c</text><text x="722" y="268">401a3e</text>
      <text x="722" y="296">401a40</text><text x="722" y="324">401a42</text>
    </g>
    <g fill="#a5b4fc">
      <text x="798" y="128">55</text><text x="798" y="156">48 89 e5</text><text x="798" y="184">e8 1b 02 00 00</text>
      <text x="798" y="212">0f b6 07</text><text x="798" y="240">34 5a</text><text x="798" y="268">3a 06</text>
      <text x="798" y="296">75 1c</text><text x="798" y="324">ff c1</text>
    </g>
    <g fill="#111827">
      <text x="940" y="128"><tspan fill="#4338ca" font-weight="700">push</tspan>  rbp</text>
      <text x="940" y="156"><tspan fill="#4338ca" font-weight="700">mov</tspan>   rbp, rsp</text>
      <text x="940" y="184"><tspan fill="#7c3aed" font-weight="700">call</tspan>  strlen</text>
      <text x="940" y="212"><tspan fill="#4338ca" font-weight="700">movzx</tspan> eax, byte [rdi]</text>
      <text x="940" y="240"><tspan fill="#4338ca" font-weight="700">xor</tspan>   al, <tspan fill="#b45309">0x5a</tspan></text>
      <text x="940" y="268"><tspan fill="#4338ca" font-weight="700">cmp</tspan>   al, byte [rsi]</text>
      <text x="940" y="296"><tspan fill="#dc2626" font-weight="700">jne</tspan>   reject</text>
      <text x="940" y="324"><tspan fill="#4338ca" font-weight="700">inc</tspan>   ecx</text>
    </g>
  </g>
  <!-- highlight the decode line -->
  <rect x="708" y="222" width="494" height="26" rx="5" fill="#6366f1" opacity="0.10"/>
  <text x="1196" y="240" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6366f1">; decode loop</text>

  <!-- magnifier -->
  <g transform="translate(1150 300)">
    <circle r="40" fill="#ffffff" fill-opacity="0.55" stroke="url(#accent)" stroke-width="8"/>
    <path d="M28 28l34 34" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>

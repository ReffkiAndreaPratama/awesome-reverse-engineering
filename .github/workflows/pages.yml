name: Website

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Weekly Refresh"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site from data.json
        env:
          SITE_BASE: ${{ vars.SITE_BASE }}
          SITE_REPO: ${{ vars.SITE_REPO }}
          SITE_AUTHOR: ${{ vars.SITE_AUTHOR }}
          SITE_AUTHOR_URL: ${{ vars.SITE_AUTHOR_URL }}
        run: node scripts/site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

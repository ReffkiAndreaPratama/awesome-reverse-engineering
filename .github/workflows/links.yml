name: Weekly Link Check

on:
  schedule:
    - cron: "0 12 * * 3" # Wednesdays 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --config lychee.toml README.md GRAVEYARD.md llms.txt
          fail: false
      - name: Find the open dead-link issue
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "number=$(gh issue list --repo ${{ github.repository }} --label dead-link --state open --json number -q '.[0].number')" >> "$GITHUB_OUTPUT"
      - name: Open or update one dead-link issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Link check: broken links found"
          content-filepath: ./lychee/out.md
          labels: dead-link
          issue-number: ${{ steps.find.outputs.number }}

name: Check Links

on:
  schedule:
    - cron: "0 12 * * 3" # Wednesdays 12:00 UTC
  pull_request:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --max-retries 3 --accept 200,206,403,429 README.md llms.txt
          fail: false
      - name: Open an issue on broken links
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Link check: broken links found"
          content-filepath: ./lychee/out.md
          labels: dead-link
